services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-afroie}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-local-postgres-password}
      POSTGRES_DB: ${POSTGRES_DB:-afroie}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 5s
      retries: 12
    volumes:
      - postgres-data:/var/lib/postgresql/data
    restart: unless-stopped

  mailpit:
    image: axllent/mailpit:v1.30.4
    ports:
      - "127.0.0.1:8025:8025"

  app:
    image: ${APP_IMAGE:-afroie-meet:local}
    build:
      context: .
      dockerfile: Dockerfile
      target: ${APP_BUILD_TARGET:-local-runner}
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-afroie}:${POSTGRES_PASSWORD:-local-postgres-password}@db:5432/${POSTGRES_DB:-afroie}?schema=public
      SESSION_SECRET: ${SESSION_SECRET:-local-only-change-this-session-secret-before-any-deployment}
      APP_ENV: ${APP_ENV:-development}
      DEMO_DATA_ENABLED: ${DEMO_DATA_ENABLED:-true}
      INVITE_ONLY: ${INVITE_ONLY:-false}
      APP_ORIGIN: ${APP_ORIGIN:-}
      ACCOUNT_EMAIL_ORIGIN: http://localhost:${APP_PORT:-3000}
      MAILPIT_URL: http://mailpit:8025
      RUN_MIGRATIONS: ${RUN_MIGRATIONS:-true}
      LOAD_DEMO_DATA: ${LOAD_DEMO_DATA:-true}
      NODE_ENV: production
      PORT: 3000
      HOSTNAME: 0.0.0.0
    depends_on:
      mailpit:
        condition: service_started
      db:
        condition: service_healthy
    ports:
      - "${APP_BIND:-0.0.0.0}:${APP_PORT:-3000}:3000"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    restart: unless-stopped

  local-https-proxy:
    image: caddy:2.11.9-alpine@sha256:003a97808e781aa9f7e75cc2f43d34d461099031faf5e20faefb9f61126836f0
    profiles: ["local-staging-https"]
    ports:
      - "127.0.0.1:3443:443"
    volumes:
      - ./deploy/local-staging/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      app:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres-data:
  caddy-data:
  caddy-config:
